<script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- MENU HAMBURGUER LOGIC ---
        const toggleBtn = document.getElementById('gs-menu-toggle');
        const closeBtn = document.getElementById('gs-menu-close');
        const offcanvas = document.getElementById('gs-offcanvas');
        const overlay = document.getElementById('gs-overlay');

        function openMenu() {
            offcanvas.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            offcanvas.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = 'auto';
        }

        if (toggleBtn) toggleBtn.addEventListener('click', openMenu);
        if (closeBtn) closeBtn.addEventListener('click', closeMenu);
        if (overlay) overlay.addEventListener('click', closeMenu);

        // --- SEARCH LOGIC ---
        const searchToggle = document.getElementById('gs-search-toggle');
        const searchOverlay = document.getElementById('gs-search-overlay');
        const searchClose = document.getElementById('gs-search-close');
        const searchInput = document.getElementById('gs-search-input');
        const searchResults = document.getElementById('gs-search-results');
        let postsData = [];

        if (searchToggle && searchOverlay) {
            searchToggle.addEventListener('click', function() {
                searchOverlay.style.display = 'block';
                document.body.style.overflow = 'hidden';
                searchInput.focus();
                
                // Fetch posts.json only once
                if (postsData.length === 0) {
                    fetch('/posts.json')
                        .then(response => response.json())
                        .then(data => { postsData = data; })
                        .catch(err => console.error('Erro ao carregar pesquisa', err));
                }
            });
            
            searchClose.addEventListener('click', function() {
                searchOverlay.style.display = 'none';
                document.body.style.overflow = 'auto';
            });
            
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                searchResults.innerHTML = '';
                if (query.length < 2) return;
                
                const filtered = postsData.filter(post => post.title.toLowerCase().includes(query));
                
                if (filtered.length === 0) {
                    searchResults.innerHTML = '<p style="color:#aaa; text-align:center; padding:1rem;">Nenhum resultado encontrado.</p>';
                    return;
                }
                
                filtered.forEach(post => {
                    const link = document.createElement('a');
                    link.href = '/' + post.slug + '/';
                    link.style.display = 'flex';
                    link.style.gap = '15px';
                    link.style.alignItems = 'center';
                    link.style.padding = '10px 0';
                    link.style.borderBottom = '1px solid #333';
                    link.style.color = '#fff';
                    link.style.textDecoration = 'none';
                    
                    let imgHtml = post.image ? `<img src="${post.image}" style="width:60px; height:60px; object-fit:cover; border-radius:4px;">` : `<div style="width:60px; height:60px; background:#444; border-radius:4px;"></div>`;
                    
                    link.innerHTML = imgHtml + `<div><div style="font-size:0.8rem; color:#aaa;">${post.date || ''}</div><div style="font-weight:700;">${post.title}</div></div>`;
                    searchResults.appendChild(link);
                });
            });
        }
    });
</script>

<script>
    // Carrossel nativo simplificado (substituto das chamadas de script originais caso tenha blocos CMS)
    document.addEventListener('DOMContentLoaded', function() {
        document.body.addEventListener('click', function(e) {
            const btnPrev = e.target.closest('.btn-carousel-prev');
            if (btnPrev) {
                const wrapper = btnPrev.closest('div[id^="carrossel-"]');
                const track = wrapper.querySelector('.dsc-track');
                const item = track.querySelector('.dsc-item');
                if (track && item) {
                    const scrollAmount = item.offsetWidth + 20;
                    if (track.scrollLeft <= 5) { track.scrollTo({ left: track.scrollWidth, behavior: 'smooth' }); } 
                    else { track.scrollBy({ left: -scrollAmount, behavior: 'smooth' }); }
                }
                return;
            }
            const btnNext = e.target.closest('.btn-carousel-next');
            if (btnNext) {
                const wrapper = btnNext.closest('div[id^="carrossel-"]');
                const track = wrapper.querySelector('.dsc-track');
                const item = track.querySelector('.dsc-item');
                if (track && item) {
                    const scrollAmount = item.offsetWidth + 20;
                    if (track.scrollLeft + track.offsetWidth >= track.scrollWidth - 5) { track.scrollTo({ left: 0, behavior: 'smooth' }); } 
                    else { track.scrollBy({ left: scrollAmount, behavior: 'smooth' }); }
                }
                return;
            }
        });
    });
</script>
